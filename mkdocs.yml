site_name: erdify-studio
site_description: Arrange erdify ERDs by drag and drop, commit the layout and check it in CI
site_url: https://erdify-studio.devsuit.io/
repo_url: https://github.com/devsuit-berlin/erdify-studio
repo_name: devsuit-berlin/erdify-studio
edit_uri: edit/main/docs/
copyright: 'Created &amp; maintained with ❤️ by <a href="https://devsuit.de" target="_blank" rel="noopener">devsuit GmbH</a>'

# docs/ also holds the internal design docs and style guide: not part of the site.
exclude_docs: |
  design/
  styleguide/
  claude-code/

# Relative src/srcset in raw HTML (e.g. the logo <img> tags in brand.md) resolved for the page URL.
hooks:
  - scripts/mkdocs_raw_html_urls.py

theme:
  name: material
  logo: assets/erdify-studio-favicon.svg
  favicon: assets/favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.footer
    - content.action.edit
    - content.code.copy
    - search.suggest

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/devsuit-berlin/erdify-studio
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/erdify-studio/

nav:
  - Home: index.md
  - Installation: installation.md
  - Quickstart: quickstart.md
  - Usage:
      - The canvas: usage/canvas.md
      - Check in CI & pre-commit: usage/ci.md
      - Place new tables: usage/place.md
      - Export SVGs: usage/export.md
  - Configuration: configuration.md
  - The layout file: layout-file.md
  - Brand: brand.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.snippets:
      check_paths: true  # base path: the repo root (mkdocs runs there)
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences

plugins:
  - search
  # Downloads external assets (the Google Fonts) at build time and serves them from
  # the site itself: no third-party requests for readers (GDPR).
  - privacy
