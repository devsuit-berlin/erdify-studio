[project]
name = "erdify_studio"
dynamic = ["version"]
description = ""
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "devsuit GmbH", email = "tech@devsuit.de" }, { name = "Fabian Clemenz", email = "fabian.clemenz@devsuit.de" }]
keywords = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/devsuit-berlin/erdify-studio"
Repository = "https://github.com/devsuit-berlin/erdify-studio"

[dependency-groups]
dev = [
    "poethepoet>=0.49.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.poe.tasks]
test = { help = "Run the test suite", cmd = "pytest -vv" }
lint = { help = "Lint", cmd = "ruff check ." }
format = { help = "Format", cmd = "ruff format ." }
build = { help = "Build sdist + wheel into dist/", cmd = "uv build" }

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src"]

[tool.ruff]
line-length = 100
indent-width = 4

[tool.ruff.lint]
# devsuit baseline: pycodestyle (E/W) + pyflakes (F) + isort (I, black-compatible).
select = ["E", "F", "W", "I"]

[tool.ruff.format]
docstring-code-format = true
# Markdown is prose: ruff 0.17+ would reformat the code examples in the docs.
exclude = ["*.md"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# Version is derived from the latest git tag (e.g. v1.2.3) — no manual bumping.
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/erdify_studio"]
