default_language_version:
  python: python3.13
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: check-instructions
        name: Check AI instruction files (CLAUDE.md imports, applyTo globs, size budget)
        entry: python scripts/check_instructions.py
        language: python
        pass_filenames: false
        # Globs depend on the tracked file list, so a rename anywhere can break it.
        always_run: true
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
