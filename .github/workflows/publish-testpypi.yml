name: Publish to TestPyPI

# Manual dry run of the release path (tests, frontend, wheel check, Trusted Publishing)
# against TestPyPI before a real release, as in erdify.
on:
  workflow_dispatch:
    inputs:
      version:
        # hatch-vcs derives the version from git tags; without a release tag it would be
        # a local version (`0.1.dev42+g…`), which PyPI rejects. TestPyPI rejects
        # duplicates too: bump for re-runs (0.1.0.dev1, 0.1.0.dev2, …).
        description: "Version to publish, e.g. 0.1.0.dev1"
        required: true
        type: string

# Least privilege by default; the publish job adds only what it needs.
permissions:
  contents: read

jobs:
  # npm and Python build dependencies run here, without the OIDC token (as in publish.yml).
  build:
    name: Build the distributions
    runs-on: ubuntu-latest
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ inputs.version }}
    steps:
      - name: Refuse a version that is not PEP 440 without a local part
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?(\.dev[0-9]+)?$ ]] \
            || { echo "version '$VERSION' is not X.Y.Z[aN|bN|rcN][.devN]" >&2; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest-known"
          enable-cache: false
      - name: Run the tests
        run: uv run --frozen poe test --cov-fail-under=90
      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - run: uv build
      - name: Refuse a wheel without the frontend
        run: uv run --frozen python scripts/check_wheel.py dist
      - name: The wheel carries the requested version
        env:
          VERSION: ${{ inputs.version }}
        run: ls dist/ && ls dist/*.whl | grep -q "erdify_studio-${VERSION}-"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 7

  publish:
    name: Publish to TestPyPI
    needs: [build]
    runs-on: ubuntu-latest
    # Separate gated environment; needs its own Trusted Publisher on test.pypi.org.
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest-known"
          enable-cache: false
      - name: Publish to TestPyPI
        run: uv publish --trusted-publishing always --publish-url https://test.pypi.org/legacy/
