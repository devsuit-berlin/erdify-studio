name: Packaging

concurrency:
  group: "packaging-${{ github.event_name == 'push' && github.sha || github.ref }}"
  cancel-in-progress: true

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

permissions:
  contents: read

jobs:
  package:
    name: Build the wheel with the frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # hatch-vcs derives the version from the latest tag
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest-known"
      - name: Build the frontend (type-check + Vite)
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: The built frontend loads nothing from the network
        run: uv run --frozen python scripts/check_static.py
      - run: uv build
      - run: uv run --frozen python scripts/check_wheel.py dist
      - name: Install the wheel without Node and run the CLI
        shell: bash
        run: |
          uv venv /tmp/wheel-env
          VIRTUAL_ENV=/tmp/wheel-env uv pip install dist/*.whl
          env PATH="/tmp/wheel-env/bin:/usr/bin:/bin" bash -c '
            if command -v node; then echo "node must not be on PATH" >&2; exit 1; fi
            erdify-studio --help
            erdify-studio --version'
      - name: The sql extra pulls in erdify[sql]
        shell: bash
        run: |
          uv venv /tmp/sql-env
          wheel=$(ls dist/*.whl)
          VIRTUAL_ENV=/tmp/sql-env uv pip install "${wheel}[sql]"
          /tmp/sql-env/bin/python -c "import sqlglot; print('sqlglot', sqlglot.__version__)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 7
