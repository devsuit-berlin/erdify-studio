name: Publish to PyPI

on:
  release:
    types: [published]

# Least privilege by default; the publish job adds only what it needs.
permissions:
  contents: read

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    # Gated environment: required reviewers + tag-only deployment (v*), as in erdify.
    environment: pypi
    permissions:
      # OIDC token for PyPI Trusted Publishing - no long-lived API token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # hatch-vcs takes the version from the release tag
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest-known"
      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - run: uv build
      - name: Refuse a wheel without the frontend
        run: uv run --frozen python scripts/check_wheel.py dist
      - name: Publish to PyPI
        # No token: uv reads the OIDC credentials minted via id-token: write.
        run: uv publish --trusted-publishing always
